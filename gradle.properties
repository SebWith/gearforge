# NOTE: do NOT force -Dfile.encoding=UTF-8 here. On Windows, the forked test worker's
# classpath is passed via a Java @argfile that the native launcher reads using the OS
# ANSI code page (CP1252). Forcing UTF-8 in the daemon writes the argfile as UTF-8 and
# corrupts non-ASCII project paths -> ClassNotFoundException.
# Kotlin sources are always read as UTF-8 by the compiler, so compilation is unaffected.
org.gradle.jvmargs=-Xmx2048m
org.gradle.daemon=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
# AGP 8.13.2's bundled lint embeds a Kotlin 2.2.20 frontend that cannot read Kotlin 2.4 metadata.
android.experimental.lint.version=9.4.1
