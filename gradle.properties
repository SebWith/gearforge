# NOTE: do NOT force -Dfile.encoding=UTF-8 here. On Windows, the forked test worker's
# classpath is passed via a Java @argfile that the native launcher reads using the OS
# ANSI code page (CP1252). Forcing UTF-8 in the daemon writes the argfile as UTF-8 and
# corrupts non-ASCII project paths (e.g. "överför skrivbord") -> ClassNotFoundException.
# Kotlin sources are always read as UTF-8 by the compiler, so compilation is unaffected.
org.gradle.jvmargs=-Xmx2048m
org.gradle.daemon=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
