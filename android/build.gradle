import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// ---------------------------------------------------------------------------
// Single source of truth for AdMob IDs (see MONETIZATION_CONFIG.md).
//
// Defaults are Google's official TEST values so debug/release builds always
// compile without hard-coding production IDs. To use real IDs for a release:
//   gradlew :android:assembleRelease \
//       -PadmobAppId=ca-app-pub-XXXX~YYYY \
//       -PadmobRewardedUnitId=ca-app-pub-XXXX/YYYY
// ---------------------------------------------------------------------------
def admobAppId = project.findProperty('admobAppId') ?: 'ca-app-pub-3940256099942544~3347511713'
def admobRewardedUnitId = project.findProperty('admobRewardedUnitId') ?: 'ca-app-pub-3940256099942544/5224354917'

// ---------------------------------------------------------------------------
// Release signing (Phase 5, ACTION_PLAN point 30).
//
// Credentials live in android/keystore.properties (gitignored, never commit).
// Signing is OPTIONAL: if the file is absent, assembleRelease keeps producing
// an unsigned APK (android-release-unsigned.apk) so CI/local builds without
// the keystore still work. With the file present, assembleRelease produces a
// signed APK (android-release.apk).
// ---------------------------------------------------------------------------
def keystorePropertiesFile = file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = 'com.gearforge.app'
    compileSdk 36

    defaultConfig {
        // applicationId = Play Console package (com.gearforge.geargenerator).
        // The namespace stays com.gearforge.app so existing classes/R/BuildConfig
        // keep their package and manifest components resolve correctly.
        applicationId "com.gearforge.geargenerator"
        minSdk 24
        // targetSdk 36 is required for Play submission from Aug 2026.
        targetSdk 36
        // versionCode 10: same 1.1 content as the frozen 9 build — 9 was already consumed
        // (Play Console rejected the upload on 2026-10-03 with "Versionskoden 9 har redan
        // använts"), and Play never accepts a reused versionCode, so this release takes the
        // next number. v8 fixed the missing runtime WRITE_EXTERNAL_STORAGE request (on
        // API 24..28 the export writes straight to public external storage; with no runtime
        // grant every export failed with a SecurityException that the Result-based error
        // handling turned into a generic "export failed"), and v7 added the In-App Review
        // card. 5/6/7/8/9 are all in use.
        // versionName 1.1: the first release that changes what a user measures and sees — the
        // HUD's anchors and diameters, the playback base rate and the viewport's layout —
        // rather than repairing one code path behind an unchanged screen.
        versionCode 10
        versionName "1.1"

        // Injects the AdMob App ID into AndroidManifest.xml meta-data.
        manifestPlaceholders = [admobAppId: admobAppId]

        // Exposes the IDs to Kotlin (BuildConfig.ADMOB_APP_ID / ADMOB_REWARDED_UNIT_ID).
        buildConfigField 'String', 'ADMOB_APP_ID', "\"$admobAppId\""
        buildConfigField 'String', 'ADMOB_REWARDED_UNIT_ID', "\"$admobRewardedUnitId\""

        // Instrumented device tests (MediaStore recovery path). Test-only: this attribute
        // lands in the test APK's manifest, not the app's.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Point 19: enable R8 code shrinking + resource shrinking for release.
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Point 30: sign the release APK when keystore.properties is present.
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
        // Measurement-only twin of release: same R8/resource shrinking and non-debuggable runtime,
        // but debug-signed, shell-profileable (src/benchmark/AndroidManifest.xml) and installed
        // side by side. Never uploaded; it keeps the default test AdMob IDs, and the release ID
        // guard below only watches assembleRelease/bundleRelease.
        benchmark {
            initWith release
            signingConfig = signingConfigs.debug
            matchingFallbacks = ['release']
            applicationIdSuffix = '.benchmark'
            debuggable = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // local.properties (machine-specific, gitignored, generated by the tooling)
        // uses the standard unescaped `sdk.dir=C:/...` form, which the PropertyEscape
        // detector falsely flags as an error. This file is irrelevant to the app binary.
        disable 'PropertyEscape'
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }
    }

    gradle.taskGraph.whenReady { taskGraph ->
        def buildingRelease = taskGraph.allTasks.any { it.name == 'assembleRelease' || it.name == 'bundleRelease' }
        if (buildingRelease) {
            if (admobAppId.startsWith('ca-app-pub-3940256099942544') ||
                admobRewardedUnitId.startsWith('ca-app-pub-3940256099942544')) {
                throw new GradleException("Release build requires real AdMob IDs (-PadmobAppId=... -PadmobRewardedUnitId=...)")
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    constraints {
        implementation('com.google.guava:guava:32.0.1-android') {
            because 'Fix CVE-2020-8908 and CVE-2023-2976; retain the Android variant and Windows temp-file compatibility'
        }
    }
    implementation project(':core')
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7'
    implementation 'com.google.android.gms:play-services-ads:23.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:2.2.0'
    implementation 'com.android.billingclient:billing:9.1.0'
    // Play In-App Review (tester report opportunity 4): native rating card.
    implementation 'com.google.android.play:review-ktx:2.0.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.json:json:20240303'
    // On-device verification of the MediaStore recovery branch (JVM tests configure
    // final Context, packageManager and ContentResolver APIs).
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
